schema = 1
id = "agentsessions.omp"
name = "OMP Agent Sessions"
description = "Indexes OMP sessions from local JSONL files."
version = "0.1.0"
license = "Apache-2.0"
kind = "plugin"

[plugin]
command = "agentsessions.omp"
entrypoint = "plugin"

[agent-sessions]
name = "omp"
callback = "__omux_agent_sessions"
arguments = ["discover"]
source_kind = "omp_jsonl"
resume_command = "omp --resume {session_id}"

[files.entrypoint]
source = "plugin"
target = "plugin"
executable = true

[files.manifest]
source = "omux-plugin.toml"
target = "omux-plugin.toml"
executable = false
