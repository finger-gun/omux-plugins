schema = 1
id = "settings-ui"
name = "Settings UI"
description = "Opens a graphical settings editor for OpenMUX config.toml."
version = "0.1.4"
license = "Apache-2.0"
kind = "plugin"

[plugin]
command = "settings-ui"
entrypoint = "plugin"

[files.entrypoint]
source = "plugin"
target = "plugin"
executable = true

[files.manifest]
source = "omux-plugin.toml"
target = "omux-plugin.toml"
executable = false

[menu.configuration.open-settings]
location = "Configuration"
title = "Open Settings"
command = "settings-ui"
arguments = []
