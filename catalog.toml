schema = 1

[packages.hello-pane]
kind = "plugin"
name = "Hello Pane"
description = "Creates a sample extension pane."
version = "0.1.0"
path = "plugins/hello-pane/omux-plugin.toml"
tags = ["demo", "extension-pane"]

[packages.macos-notify]
kind = "plugin"
name = "macOS Notify"
description = "Sends a native macOS notification from the terminal."
version = "0.1.0"
path = "plugins/macos-notify/omux-plugin.toml"
tags = ["notifications", "macos", "automation"]

[packages.settings-ui]
kind = "plugin"
name = "Settings UI"
description = "Opens a graphical settings editor for OpenMUX config.toml."
version = "0.1.4"
path = "plugins/settings-ui/omux-plugin.toml"
tags = ["settings", "configuration", "extension-pane"]

[packages.opencode]
kind = "plugin"
name = "OpenCode Agent Sessions"
description = "Indexes OpenCode sessions from the local SQLite store."
version = "0.1.0"
path = "plugins/opencode/omux-plugin.toml"
tags = ["agent-sessions", "opencode", "sqlite"]
